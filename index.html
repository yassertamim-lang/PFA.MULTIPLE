<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jeu Multiplication</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
<h1>Jeu de Multiplication 🎯</h1>
<h2>SMALL AGE & BIG IQ</h2>
<!-- Sign-in container -->


<div id="signinContainer">
    <div class="signin-form">
        <h3>👋 Commence à jouer !</h3>
        <input type="text" id="username" placeholder="Ton nom" maxlength="20">
        <input type="number" id="age" placeholder="Ton âge" min="5" max="15">
        <button id="btnSignIn">Jouer ! 🚀</button>
        <p id="signinError" class="error hidden"></p>
    </div>
</div>

<div id="playerInfo" class="hidden">
    <div class="welcome">Bienvenue, <span id="playerName"></span>! <button id="btnSignOut">Déconnexion</button></div>
    <div id="scoreHistory" class="score-history"></div>
</div>

<div id="gameArea" class="hidden">
    <div id="top">
        <div>
            <div>Score: <span id="score">0</span>%</div>
            <div id="scoreBar" class="progress-bar">
                <div id="scoreBarFill" class="progress-bar-fill">
                    <span id="scorePercent"><br>%</span>
                </div>
            </div>
        </div>
        <div>Time: <span id="time">30</span>s</div>
    </div>

    <h2 id="question"></h2>
    <div id="answers"></div>
    <p id="result"></p>
</div>

<script src="script.js"></script>


</body>
</html>
